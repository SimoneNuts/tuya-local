name: Aurora floor lamp
products:
  - id: yivl1cgcemaj5czl
    manufacturer: LSC Smart Connect
    model: Smart Aurora floor lamp (3225183)
entities:
  - entity: switch
    dps:
      - id: 20
        type: boolean
        name: switch
  - entity: light
    name: White
    dps:
      - id: 103
        type: boolean
        name: switch
      - id: 22
        type: integer
        name: brightness
        range:
          min: 10
          max: 1000
      - id: 23
        type: integer
        name: color_temp
        range:
          min: 0
          max: 1000
        mapping:
          - target_range:
              min: 2700
              max: 6500
  - entity: light
    name: Ambient
    dps:
      - id: 102
        type: boolean
        name: switch
      - id: 24
        type: hex
        name: rgbhsv
        format:
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 2
            range:
              min: 0
              max: 1000
          - name: v
            bytes: 2
            range:
              min: 0
              max: 1000
      - id: 107
        type: string
        name: effect
        mapping:
          - dps_val: "1"
            value: Iceland Blue
          - dps_val: "2"
            value: Sea Of Clouds
          - dps_val: "3"
            value: Firefly Night
          - dps_val: "4"
            value: Grassland
          - dps_val: "5"
            value: Late Autumn
          - dps_val: "6"
            value: Party
  - entity: light
    name: Aurora
    dps:
      - id: 101
        type: boolean
        name: switch
      - id: 110
        type: integer
        name: brightness
        range:
          min: 10
          max: 1000
      - id: 104
        type: string
        name: effect
        mapping:
          - dps_val: "1"
            value: Red
          - dps_val: "2"
            value: Green
          - dps_val: "3"
            value: Blue
          - dps_val: "4"
            value: Red & Green
          - dps_val: "5"
            value: Red & Blue
          - dps_val: "6"
            value: Green & Blue
          - dps_val: "7"
            value: Red & Green & Blue 1
          - dps_val: "8"
            value: Red & Green & Blue 2
  - entity: number
    name: Effect speed
    category: config
    dps:
      - id: 108
        type: integer
        name: value
        optional: true
        range:
          min: 1
          max: 100
  - entity: time
    translation_key: timer
    category: config
    dps:
      - id: 26
        type: integer
        name: second
        optional: true
        range:
          min: 0
          max: 86400
